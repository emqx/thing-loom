<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESP32 BH1750FVI Monitor</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1220; color: #e5eefc; }
    main { width: min(520px, calc(100% - 32px)); }
    h1 { margin-bottom: 6px; font-size: clamp(28px, 6vw, 44px); }
    #status { color: #fbbf24; margin: 0 0 28px; }
    #status.online { color: #34d399; }
    article { padding: 28px; border: 1px solid #263653; border-radius: 18px; background: #111c31; }
    .label { color: #93a4bd; }
    .value { margin-top: 12px; font-size: clamp(42px, 10vw, 72px); font-weight: 700; }
    footer { margin-top: 22px; color: #71829e; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>BH1750FVI Light Monitor</h1>
    <p id="status" role="status">Connecting to MQTT…</p>
    <article aria-label="Sensor reading">
      <div class="label">Illuminance</div>
      <div class="value"><span id="illuminance">--</span> lx</div>
    </article>
    <footer>Topic: __MQTT_TOPIC__ · Browser received at: <span id="updated">--</span></footer>
  </main>

  <script src="https://unpkg.com/mqtt@5.15.2/dist/mqtt.min.js"
          integrity="sha384-haZiwxTLortiFcYMBEEE1+8ayC+o18YtuwHZv+4WQHoPaLzRjwOV6h7Vva5iLSCZ"
          crossorigin="anonymous"></script>
  <script src="./mqtt-config.js"></script>
  <script>
    const status = document.querySelector('#status');
    const client = mqtt.connect(MQTT_CONFIG.url, {
      username: MQTT_CONFIG.username,
      password: MQTT_CONFIG.password,
      clientId: `bh1750-web-${Date.now()}-${Math.random().toString(16).slice(2)}`,
      clean: true,
      connectTimeout: 5000,
      reconnectPeriod: 2000
    });

    client.on('connect', () => client.subscribe(MQTT_CONFIG.topic, error => {
      status.textContent = error ? `Subscription failed: ${error.message}` : 'Connected, waiting for sensor data';
      status.classList.toggle('online', !error);
    }));
    client.on('reconnect', () => {
      status.textContent = 'Connection lost, reconnecting…';
      status.classList.remove('online');
    });
    client.on('error', error => {
      status.textContent = `MQTT error: ${error.message}`;
      status.classList.remove('online');
    });
    client.on('message', (_, message) => {
      try {
        const data = JSON.parse(message.toString());
        if (!Number.isFinite(data.illuminance) || data.illuminance < 0) throw new Error('invalid payload');
        document.querySelector('#illuminance').textContent = data.illuminance.toFixed(1);
        document.querySelector('#updated').textContent = new Date().toLocaleString('en-US', { timeZoneName: 'short' });
        status.textContent = 'Receiving live data';
        status.classList.add('online');
      } catch (error) {
        status.textContent = `Ignored message: ${error.message}`;
      }
    });
  </script>
</body>
</html>
